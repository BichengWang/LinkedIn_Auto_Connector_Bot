[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-interaction"
version = "2.0.0"
description = "LinkedIn automation: messaging, connections, social interaction, posts, job matching and Easy Apply."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "selenium>=4.22,<5",
    "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
linkedin-interaction = "linkedin_interaction.cli:main"

[tool.setuptools]
packages = ["linkedin_interaction"]
